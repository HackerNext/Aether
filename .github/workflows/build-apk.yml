name: Build AETHER Native Android APK (No PC Needed)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AETHER repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK 36 Platform is installed (Health Connect 1.1.0 Stable)
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "platforms;android-36" "build-tools;35.0.0"
          fi

      - name: Install npm packages & build AETHER web app
        run: |
          npm install
          npm run build

      - name: Generate Android project & configure Health Connect 1.1.0
        run: |
          npx cap add android
          node scripts/configure-android.mjs
          npx cap sync android

      - name: Compile installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload ready-to-install AETHER APK
        uses: actions/upload-artifact@v6
        with:
          name: AETHER-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
